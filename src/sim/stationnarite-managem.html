  // ---------- Données ----------
  var years = []; for (var y = 2000; y <= 2026; y++) years.push(y);

  var ORDER = RAW.d.map(function (d, i) { return i; }).sort(function (a, b) { return RAW.d[a] < RAW.d[b] ? -1 : 1; });
  var DATES = ORDER.map(function (i) { return RAW.d[i]; }), PRICES = ORDER.map(function (i) { return RAW.p[i]; });

  function render() {

      (fix ? (nfix ? nfix + " cotations aberrantes corrigées sur la période." : "Aucune cotation à corriger sur la période.") : "Sans correction, les sauts artificiels d'un facteur 10 entre 2012 et 2016 créent des rendements extrêmes qui faussent l'autocorrélation des rendements.") +

    drawACF(rho, 1.96 / Math.sqrt(nS));

  ["m-from", "m-to", "m-series", "m-lags", "m-fix"].forEach(function (id) { $(id).addEventListener("change", render); });

  // ---------- Graphiques ----------
  var css = getComputedStyle(document.documentElement), col = function (n) { return css.getPropertyValue(n).trim(); };

    c.strokeStyle = col("--ink"); c.beginPath(); c.moveTo(g.L, g.h - g.B + .5); c.lineTo(g.w - g.R, g.h - g.B + .5); c.stroke();

    for (var t = lo; t <= hi + 1e-12; t += s) { var y = Math.round(Y(t)) + .5; c.beginPath(); c.moveTo(g.L, y); c.lineTo(g.w - g.R, y); c.stroke(); c.fillText(fr(Math.abs(t) < 1e-12 ? 0 : t, s < 0.1 ? 2 : 1), g.L - 8, y); }
    c.fillStyle = "rgba(15,42,74,.10)"; c.fillRect(g.L, Y(band), g.w - g.L - g.R, Y(-band) - Y(band));
